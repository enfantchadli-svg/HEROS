name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# أقل صلاحيات ممكنة؛ وظيفة النشر وحدها ترفعها إلى write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # npm ci يثبّت الإصدارات المقفلة بالضبط (ارفع package-lock.json إلى المستودع)
      - name: Install dependencies
        run: |
          install() { if [ -f package-lock.json ]; then npm ci; else npm install; fi; }
          for i in 1 2 3 4; do
            if install; then exit 0; fi
            echo "::warning::فشل تثبيت الحزم (محاولة $i من 4) — غالباً خطأ مؤقت من GitHub، إعادة المحاولة..."
            rm -rf node_modules
            sleep $((i * 20))
          done
          exit 1
      - name: Security check (index.html)
        run: node scripts/check-security.cjs

      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --assetPath assets
      - name: Harden generated Android project
        run: node scripts/android-harden.cjs
      - run: npx cap sync android

      - name: Choose build mode
        id: mode
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=APK غير موقّع بمفتاحك::أسرار التوقيع غير مضبوطة، سيُبنى APK تجريبي (debug) تعتبره الأجهزة غير موثوق. نفّذ الخطوات في SECURITY.md لإنتاج نسخة Release موقّعة."
          fi

      - name: Build release APK (signed with your key)
        if: steps.mode.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          (cd android && ./gradlew --no-daemon assembleRelease)
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          mkdir -p out
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # zipalign يجب أن يسبق apksigner
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "out/Heroes-$VERSION-android.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --verbose --print-certs "out/Heroes-$VERSION-android.apk"
          "$BT/apksigner" verify --print-certs "out/Heroes-$VERSION-android.apk" | grep -i "SHA-256" > out/ANDROID-CERT-SHA256.txt
          "$BT/aapt2" dump badging "out/Heroes-$VERSION-android.apk" | head -n1
          if "$BT/aapt2" dump badging "out/Heroes-$VERSION-android.apk" | grep -q "application-debuggable"; then
            echo "::error::الـAPK قابل للتنقيح (debuggable) — مرفوض"; exit 1
          fi

      - name: Build debug APK (fallback — NOT for distribution)
        if: steps.mode.outputs.signed != 'true'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          (cd android && ./gradlew --no-daemon assembleDebug)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Heroes-$VERSION-android-DEBUG-UNSIGNED.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: heroes-android-apk
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install dependencies
        shell: bash
        run: |
          install() { if [ -f package-lock.json ]; then npm ci; else npm install; fi; }
          for i in 1 2 3 4; do
            if install; then exit 0; fi
            echo "::warning::فشل تثبيت الحزم (محاولة $i من 4) — غالباً خطأ مؤقت من GitHub، إعادة المحاولة..."
            rm -rf node_modules
            sleep $((i * 20))
          done
          exit 1
      - name: Security check (index.html)
        run: node scripts/check-security.cjs
      - name: Build Windows installers
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never
      - name: Report Authenticode signature
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object { "$($_.Name) => $((Get-AuthenticodeSignature $_).Status)" }
      - name: Signing notice
        shell: bash
        run: echo "::notice title=ويندوز::ملفات ويندوز غير موقّعة برقم ناشر، ستظهر SmartScreen عند أول تشغيل. الخيارات في SECURITY.md."
      - uses: actions/upload-artifact@v4
        with:
          name: heroes-windows
          path: dist/*.exe

  # يعمل فقط عند دفع وسم إصدار مثل v0.9.1 — يضع الملفات + SHA256 في صفحة Releases
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Refuse to publish debug builds
        run: |
          if ls release | grep -qi "DEBUG"; then
            echo "::error::يوجد APK تجريبي ضمن الملفات. اضبط أسرار التوقيع (SECURITY.md) ثم أعد البناء."
            exit 1
          fi
      - name: Checksums
        run: |
          (cd release && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release/
          cat release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
